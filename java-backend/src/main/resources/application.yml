server:
  port: 8080
  servlet:
    context-path: /api

spring:
  main:
    allow-circular-references: false
  application:
    name: hfusionhub-backend

  # JDK 21+ 虚拟线程：每个请求一个虚拟线程（毫秒级创建、内存极小），
  # 阻塞式 DB/HTTP 调用不再占满 Tomcat 平台线程，显著提升并发与响应速度。
  # 仅在本机 JVM 为 21+ 时生效；JDK 17 下该属性被忽略，无副作用。
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}

  # 数据源配置 — 生产环境通过环境变量覆盖:
  #   SPRING_DATASOURCE_URL=jdbc:mysql://mysql8:3306/hfusionhub?...
  #   SPRING_DATA_REDIS_HOST=redis7
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hfusionhub?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:hfusionhub}
    password: ${DB_PASSWORD:}
    # 虚拟线程下平台线程不再是瓶颈，数据库连接池成为并发上限——
    # 适当调大池子（40），并按负载收缩到 10；连接等待 30s、单连接最长 30min。
    hikari:
      pool-name: HFusionHubPool
      maximum-pool-size: ${DB_POOL_MAX:40}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:30000}
      max-lifetime: 1800000
      idle-timeout: 600000

  # Flyway 数据库版本管理
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 文件上传大小限制 — 与应用内业务校验（Document 10MB / Plugin 50MB）对齐。
  # 缺省时 Spring Boot 默认为 max-file-size=1MB / max-request-size=10MB，
  # 会在 Tomcat 层直接拒绝大文件，使 DocumentServiceImpl / PluginController
  # 的 10MB/50MB 业务校验永远执行不到。
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:60MB}

  # Redis 配置 — 生产环境通过环境变量覆盖:
  #   SPRING_DATA_REDIS_HOST=redis7
  #   SPRING_DATA_REDIS_PASSWORD=your_redis_password
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # 密码：compose 传入 SPRING_DATA_REDIS_PASSWORD；本机开发回退读 docker/.env 的 REDIS_PASSWORD
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      database: 0
      timeout: 10000ms

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.hfusionhub.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  token-style: uuid
  is-log: false

# Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: HFusionHub
      paths-to-match: /**
      packages-to-scan: com.hfusionhub.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# Python AI 服务配置
python-ai:
  base-url: http://localhost:9000
  timeout: 60000
  engine:
    url: http://localhost:9000
  callback-base-url: http://localhost:${server.port}${server.servlet.context-path}
  callback-secret: ${CALLBACK_SECRET:}
  internal-token: ${PYTHON_AI_INTERNAL_TOKEN:}

# Durable document-index job recovery. A task running longer than this timeout
# is re-submitted with a new version; old worker callbacks are rejected.
rag:
  index:
    stale-after-minutes: ${RAG_INDEX_STALE_AFTER_MINUTES:30}
    max-attempts: ${RAG_INDEX_MAX_ATTEMPTS:3}
    recovery-delay-ms: ${RAG_INDEX_RECOVERY_DELAY_MS:300000}

# AI 服务配置
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:9000}
  timeout: ${AI_SERVICE_TIMEOUT:120000}

# MinIO 配置 (port 9002 — avoid conflict with Python AI :9000)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:hfusionhub}

# Plugin Runner 配置
plugin-runner:
  base-url: ${PLUGIN_RUNNER_URL:http://localhost:9100}
  # 必须显式配置（第十五轮 P0-8 移除弱默认值「plugin-runner-secret」）；
  # docker/.env 与 deploy/.env 均已生成随机值。未配置时 runner 调用 403 fail-closed。
  token: ${PLUGIN_RUNNER_TOKEN:}
  timeout: ${PLUGIN_RUNNER_TIMEOUT:60000}

# 管理员初始化配置
# ADMIN_PASSWORD 环境变量控制首次部署时的管理员账户创建
# 未设置时跳过创建，已设置时创建/更新 admin 账户的密码
app:
  trusted-proxy-headers: ${TRUSTED_PROXY_HEADERS:false}
  # 演示数据端点（/demo/*）总开关 — 开发/演示默认开启；
  # 生产部署通过 deploy/.env 的 DEMO_ENDPOINTS_ENABLED 默认关闭（/clear 有数据破坏性）
  demo:
    endpoints-enabled: ${DEMO_ENDPOINTS_ENABLED:true}
  model-credentials:
    # 用于加密用户提供的模型 API Key（AES-GCM）。必须是独立于其它内部令牌的
    # 长随机值——第十五轮 P0-8 起不再回退复用 PYTHON_AI_INTERNAL_TOKEN，
    # 避免轮换内部令牌时静默毁掉全部已存凭据。未配置时保存/读取 API Key
    # 直接报错（fail-fast）。若历史数据曾以内部令牌加密，需重新录入。
    encryption-key: ${MODEL_CREDENTIAL_ENCRYPTION_KEY:}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  # SSO/OIDC 通用客户端（app.oidc.*）— 默认关闭。
  # 生产通过环境变量启用并覆盖端点/凭据（见 docs/OIDC.md 与 ENVIRONMENT.md）。
  # 流程：/user/sso/authorize → IdP 授权 → /user/sso/callback → userinfo → 建号/关联 → satoken 回前端。
  oidc:
    enabled: ${OIDC_ENABLED:false}
    provider-name: ${OIDC_PROVIDER_NAME:generic}
    authorization-endpoint: ${OIDC_AUTHORIZATION_ENDPOINT:}
    token-endpoint: ${OIDC_TOKEN_ENDPOINT:}
    user-info-endpoint: ${OIDC_USERINFO_ENDPOINT:}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
    redirect-uri: ${OIDC_REDIRECT_URI:}
    frontend-redirect-uri: ${OIDC_FRONTEND_REDIRECT_URI:}
    scopes: ${OIDC_SCOPES:openid profile email}
    username-claim: ${OIDC_USERNAME_CLAIM:preferred_username}
    email-claim: ${OIDC_EMAIL_CLAIM:email}
    name-claim: ${OIDC_NAME_CLAIM:name}
    auto-provision: ${OIDC_AUTO_PROVISION:true}
    link-by-email: ${OIDC_LINK_BY_EMAIL:true}

# =====================================================
# Agent 异步任务调度与可靠恢复（V13）
# =====================================================
agent:
  # 队列模式开关 — true=新 Run 入队由 Worker 异步执行, false=请求线程直连 Python（兼容旧行为）
  queue:
    enabled: ${AGENT_QUEUE_ENABLED:false}
  worker:
    poll-delay-ms: ${AGENT_WORKER_POLL_DELAY_MS:5000}
    batch-size: ${AGENT_WORKER_BATCH_SIZE:5}
  run:
    lease-seconds: ${AGENT_RUN_LEASE_SECONDS:120}
    heartbeat-seconds: ${AGENT_RUN_HEARTBEAT_SECONDS:15}
    timeout-seconds: ${AGENT_RUN_TIMEOUT_SECONDS:600}
  retry:
    max-attempts: ${AGENT_RETRY_MAX_ATTEMPTS:3}
    base-delay-seconds: ${AGENT_RETRY_BASE_DELAY_SECONDS:30}
    backoff-multiplier: ${AGENT_RETRY_BACKOFF_MULTIPLIER:2}
    max-delay-seconds: ${AGENT_RETRY_MAX_DELAY_SECONDS:600}
    retryable-error-codes: ${AGENT_RETRY_RETRYABLE_ERROR_CODES:timeout,execution_timeout,connection_error,tool_error,internal_error}
    on-approval-expiry: ${AGENT_RETRY_ON_APPROVAL_EXPIRY:false}
    max-dispatch-count: ${AGENT_RETRY_MAX_DISPATCH_COUNT:3}
  recovery:
    sweep-delay-ms: ${AGENT_RECOVERY_SWEEP_DELAY_MS:30000}
    startup-recovery: ${AGENT_RECOVERY_STARTUP:true}
  status-event:
    sse-poll-delay-ms: ${AGENT_STATUS_EVENT_SSE_POLL_MS:1000}
    retention-days: ${AGENT_STATUS_EVENT_RETENTION_DAYS:7}
  cancel-flag-ttl-seconds: ${AGENT_CANCEL_FLAG_TTL_SECONDS:3600}
  instance-id: ${AGENT_WORKER_INSTANCE_ID:}

# =====================================================
# 提示词测试用例集 批量运行异步队列（排队/进度/取消/重试）
# =====================================================
prompt-test-set:
  run:
    # true=新批量运行入队由 Worker 异步执行（排队+实时进度+可取消）
    # false=提交即完成（仅用于测试，需手动调用 executeRun）
    queue-enabled: ${PROMPT_TEST_SET_QUEUE_ENABLED:true}
    poll-delay-ms: ${PROMPT_TEST_SET_POLL_DELAY_MS:2000}
    batch-size: ${PROMPT_TEST_SET_BATCH_SIZE:5}
    # 单个用例失败后的重试总尝试次数（含首次）
    case-retry-max-attempts: ${PROMPT_TEST_SET_CASE_RETRY_MAX_ATTEMPTS:2}
    # 用例重试间隔（毫秒）
    case-retry-delay-ms: ${PROMPT_TEST_SET_CASE_RETRY_DELAY_MS:500}
    recovery-delay-ms: ${PROMPT_TEST_SET_RECOVERY_DELAY_MS:30000}
    # running 状态超过该分钟数视为失联，恢复扫描将其置为 failed
    stale-running-minutes: ${PROMPT_TEST_SET_STALE_RUNNING_MINUTES:30}
    # 优雅停机：停止轮询后等待已提交的批量运行任务结束的最长毫秒数，超时交由 stale 恢复兜底
    shutdown-timeout-ms: ${PROMPT_TEST_SET_SHUTDOWN_TIMEOUT_MS:30000}

# 日志配置
logging:
  level:
    root: INFO
    com.hfusionhub: INFO
    com.hfusionhub.mapper: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{trace_id:-}] %-5level %logger{36} - %msg%n"

# Actuator / Micrometer — Prometheus scrape endpoint
# =====================================================
# Tenant quota plan defaults (used when no tenant_quota override exists)
# =====================================================
hfusionhub:
  quota:
    # Server-side upper bound for a single chat output (tokens). Used as the
    # reservation ceiling: reserve = input estimate + max-output-tokens.
    chat:
      max-output-tokens: ${QUOTA_CHAT_MAX_OUTPUT_TOKENS:8192}
    defaults:
      free:
        chat-tokens: 100000
        agent-tokens: 100000
        index-chunks: 5000
        plugin-executions: 100
        bid-projects: 10
        tender-elements: 500
        bid-draft-chars: 100000
        bid-check-reports: 50
      pro:
        chat-tokens: 1000000
        agent-tokens: 1000000
        index-chunks: 50000
        plugin-executions: 1000
        bid-projects: 100
        tender-elements: 5000
        bid-draft-chars: 1000000
        bid-check-reports: 500
      enterprise:
        chat-tokens: 10000000
        agent-tokens: 10000000
        index-chunks: 500000
        plugin-executions: 10000
        bid-projects: 1000
        tender-elements: 50000
        bid-draft-chars: 10000000
        bid-check-reports: 5000

management:
  server:
    # Actuator 独立管理端口（第十五轮 P0-8）：
    # 1. 移出 /api 上下文后不再被 Sa-Token 登录拦截器覆盖（此前 Prometheus
    #    无会话抓取 /api/actuator/prometheus 实际 401）；
    # 2. 该端口不得向公网发布——compose 仅 expose，不映射宿主机；
    # 3. 监控抓取目标随之改为 java-backend:9092/actuator/prometheus。
    port: ${MANAGEMENT_PORT:9092}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # when-authorized：仅登录用户可查看 DB/Redis/磁盘等健康细节，
      # 避免 /health（鉴权白名单内）对未认证请求泄露内部组件状态
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: hfusionhub-backend
