# HFusionHub Helm Chart — Deployment Templates

# --- Secret ---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  mysql-root-password: {{ required "mysqlRootPassword is required" .Values.secrets.mysqlRootPassword | quote }}
  mysql-password: {{ required "mysqlPassword is required" .Values.secrets.mysqlPassword | quote }}
  python-ai-internal-token: {{ required "pythonAiInternalToken is required" .Values.secrets.pythonAiInternalToken | quote }}
  callback-secret: {{ required "callbackSecret is required" .Values.secrets.callbackSecret | quote }}
  admin-password: {{ required "adminPassword is required" .Values.secrets.adminPassword | quote }}
  deepseek-api-key: {{ required "deepseekApiKey is required" .Values.secrets.deepseekApiKey | quote }}
  {{- if .Values.pluginRunner.enabled }}
  plugin-runner-token: {{ required "pluginRunnerToken is required when pluginRunner.enabled" .Values.secrets.pluginRunnerToken | quote }}
  {{- end }}

---
# --- MySQL ---
{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mysql
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mysql.port }}
      targetPort: 3306
  selector:
    app: {{ .Release.Name }}-mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: mysql-password
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mysql-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mysql.persistence.size }}
{{- end }}

---
# --- Redis ---
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: 6379
  selector:
    app: {{ .Release.Name }}-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-redis
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}

---
# --- Java Backend ---
{{- if .Values.javaBackend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-java
spec:
  type: {{ .Values.javaBackend.service.type }}
  ports:
    - port: {{ .Values.javaBackend.service.port }}
      targetPort: {{ .Values.javaBackend.port }}
  selector:
    app: {{ .Release.Name }}-java
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-java
spec:
  replicas: {{ .Values.javaBackend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-java
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-java
    spec:
      containers:
        - name: java-backend
          image: {{ .Values.javaBackend.image }}
          ports:
            - containerPort: {{ .Values.javaBackend.port }}
          env:
            - name: DB_USERNAME
              value: {{ .Values.mysql.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: mysql-password
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://{{ .Release.Name }}-mysql:{{ .Values.mysql.port }}/{{ .Values.mysql.database }}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATA_REDIS_HOST
              value: "{{ .Release.Name }}-redis"
            - name: PYTHON_AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: python-ai-internal-token
            - name: CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: callback-secret
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: admin-password
            - name: AI_SERVICE_URL
              value: "http://{{ .Release.Name }}-python:{{ .Values.pythonAi.port }}"
            - name: JAVA_OPTS
              value: {{ .Values.javaBackend.javaOpts | quote }}
          resources:
            {{- toYaml .Values.javaBackend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.javaBackend.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.javaBackend.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: shared-uploads
              mountPath: /app/uploads
      volumes:
        - name: shared-uploads
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-uploads-pvc
{{- end }}

---
# --- Python AI ---
{{- if .Values.pythonAi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-python
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.pythonAi.port }}
      targetPort: {{ .Values.pythonAi.port }}
  selector:
    app: {{ .Release.Name }}-python
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-python
spec:
  replicas: {{ .Values.pythonAi.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-python
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-python
    spec:
      containers:
        - name: python-ai
          image: {{ .Values.pythonAi.image }}
          ports:
            - containerPort: {{ .Values.pythonAi.port }}
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: deepseek-api-key
            - name: PYTHON_AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: python-ai-internal-token
            - name: CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: callback-secret
            - name: JAVA_BACKEND_URL
              value: "http://{{ .Release.Name }}-java:{{ .Values.javaBackend.port }}"
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: {{ .Values.pythonAi.port | quote }}
            - name: VECTOR_STORE_MODE
              value: {{ .Values.vectorStore.mode | quote }}
            - name: SERVER_ENV
              value: {{ .Values.vectorStore.env | quote }}
            - name: MILVUS_HOST
              value: {{ tpl .Values.vectorStore.host $ | quote }}
            - name: MILVUS_PORT
              value: {{ .Values.vectorStore.port | quote }}
            - name: MILVUS_COLLECTION
              value: {{ .Values.vectorStore.collection | quote }}
            - name: DOCUMENT_STORAGE_ROOT
              value: /app/uploads/documents
            {{- if .Values.pluginRunner.enabled }}
            - name: PLUGIN_RUNNER_URL
              value: "http://{{ .Release.Name }}-plugin-runner:{{ .Values.pluginRunner.port }}"
            - name: PLUGIN_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: plugin-runner-token
            {{- end }}
          resources:
            {{- toYaml .Values.pythonAi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pythonAi.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.pythonAi.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: shared-uploads
              mountPath: /app/uploads
      volumes:
        - name: shared-uploads
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-uploads-pvc
{{- end }}

---
# --- Isolated Plugin Runner ---
{{- if .Values.pluginRunner.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-plugin-runner
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.pluginRunner.port }}
      targetPort: {{ .Values.pluginRunner.port }}
  selector:
    app: {{ .Release.Name }}-plugin-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-plugin-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-plugin-runner
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-plugin-runner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: plugin-runner
          image: {{ .Values.pluginRunner.image }}
          ports:
            - containerPort: {{ .Values.pluginRunner.port }}
          env:
            - name: PLUGIN_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: plugin-runner-token
            - name: PLUGIN_ARTIFACTS_DIR
              value: /opt/plugin-artifacts
            - name: DOCKER_HOST
              value: {{ required "pluginRunner.dockerHost is required when pluginRunner.enabled" .Values.pluginRunner.dockerHost | quote }}
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.pluginRunner.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pluginRunner.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pluginRunner.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: plugin-runner-tls
              mountPath: /certs/client
              readOnly: true
            - name: plugin-artifacts
              mountPath: /opt/plugin-artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: plugin-runner-tls
          secret:
            secretName: {{ required "pluginRunner.tlsSecretName is required when pluginRunner.enabled" .Values.pluginRunner.tlsSecretName }}
        - name: plugin-artifacts
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-plugin-artifacts-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-plugin-artifacts-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pluginRunner.artifactsSize }}
{{- end }}

---
# Shared Java/Python document storage. Requires an RWX-capable storage class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-uploads-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.sharedStorage.uploadsSize }}

---
# --- Milvus standalone (production vector store) ---
{{- if .Values.milvus.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-milvus
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: {{ .Values.milvus.port }}
      targetPort: {{ .Values.milvus.port }}
  selector:
    app: {{ .Release.Name }}-milvus
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-milvus
spec:
  serviceName: {{ .Release.Name }}-milvus
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-milvus
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-milvus
    spec:
      containers:
        - name: milvus
          image: {{ .Values.milvus.image }}
          ports:
            - containerPort: {{ .Values.milvus.port }}
          env:
            - name: ETCD_USE_EMBED
              value: "true"
            - name: COMMON_STORAGETYPE
              value: "local"
          resources:
            {{- toYaml .Values.milvus.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.milvus.persistence.size }}
{{- end }}

---
# --- Python AI HorizontalPodAutoscaler ---
{{- if and .Values.pythonAi.enabled (gt (int .Values.pythonAi.minReplicas) 0) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-python
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-python
  minReplicas: {{ .Values.pythonAi.minReplicas }}
  maxReplicas: {{ .Values.pythonAi.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}

---
# --- Frontend ---
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.port }}
  selector:
    app: {{ .Release.Name }}-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}

---
# --- Ingress ---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-java
                port:
                  number: {{ .Values.javaBackend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
