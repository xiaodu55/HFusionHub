# HFusionHub Helm Chart — Deployment Templates

# --- Secret ---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  mysql-root-password: {{ required "mysqlRootPassword is required" .Values.secrets.mysqlRootPassword | quote }}
  mysql-password: {{ required "mysqlPassword is required" .Values.secrets.mysqlPassword | quote }}
  python-ai-internal-token: {{ required "pythonAiInternalToken is required" .Values.secrets.pythonAiInternalToken | quote }}
  callback-secret: {{ required "callbackSecret is required" .Values.secrets.callbackSecret | quote }}
  admin-password: {{ required "adminPassword is required" .Values.secrets.adminPassword | quote }}
  deepseek-api-key: {{ required "deepseekApiKey is required" .Values.secrets.deepseekApiKey | quote }}

---
# --- MySQL ---
{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mysql
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mysql.port }}
      targetPort: 3306
  selector:
    app: {{ .Release.Name }}-mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-mysql
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: mysql-password
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mysql-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mysql.persistence.size }}
{{- end }}

---
# --- Redis ---
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: 6379
  selector:
    app: {{ .Release.Name }}-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-redis
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}

---
# --- Java Backend ---
{{- if .Values.javaBackend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-java
spec:
  type: {{ .Values.javaBackend.service.type }}
  ports:
    - port: {{ .Values.javaBackend.service.port }}
      targetPort: {{ .Values.javaBackend.port }}
  selector:
    app: {{ .Release.Name }}-java
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-java
spec:
  replicas: {{ .Values.javaBackend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-java
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-java
    spec:
      containers:
        - name: java-backend
          image: {{ .Values.javaBackend.image }}
          ports:
            - containerPort: {{ .Values.javaBackend.port }}
          env:
            - name: DB_USERNAME
              value: {{ .Values.mysql.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: mysql-password
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://{{ .Release.Name }}-mysql:{{ .Values.mysql.port }}/{{ .Values.mysql.database }}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATA_REDIS_HOST
              value: "{{ .Release.Name }}-redis"
            - name: PYTHON_AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: python-ai-internal-token
            - name: CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: callback-secret
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: admin-password
            - name: AI_SERVICE_URL
              value: "http://{{ .Release.Name }}-python:{{ .Values.pythonAi.port }}"
            - name: JAVA_OPTS
              value: {{ .Values.javaBackend.javaOpts | quote }}
          resources:
            {{- toYaml .Values.javaBackend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.javaBackend.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.javaBackend.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: shared-uploads
              mountPath: /app/uploads
      volumes:
        - name: shared-uploads
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-uploads-pvc
{{- end }}

---
# --- Python AI ---
{{- if .Values.pythonAi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-python
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.pythonAi.port }}
      targetPort: {{ .Values.pythonAi.port }}
  selector:
    app: {{ .Release.Name }}-python
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-python
spec:
  replicas: {{ .Values.pythonAi.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-python
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-python
    spec:
      containers:
        - name: python-ai
          image: {{ .Values.pythonAi.image }}
          ports:
            - containerPort: {{ .Values.pythonAi.port }}
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: deepseek-api-key
            - name: PYTHON_AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: python-ai-internal-token
            - name: CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: callback-secret
            - name: JAVA_BACKEND_URL
              value: "http://{{ .Release.Name }}-java:{{ .Values.javaBackend.port }}"
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: {{ .Values.pythonAi.port | quote }}
            - name: MILVUS_LITE_PATH
              value: /data/milvus_data.db
            - name: CHUNKS_STORE_PATH
              value: /data/chunks_store.json
            - name: DOCUMENT_STORAGE_ROOT
              value: /app/uploads/documents
          resources:
            {{- toYaml .Values.pythonAi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pythonAi.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.pythonAi.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: python-data
              mountPath: /data
            - name: shared-uploads
              mountPath: /app/uploads
      volumes:
        - name: python-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-python-pvc
        - name: shared-uploads
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-uploads-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-python-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pythonAi.persistence.size }}
{{- end }}

---
# Shared Java/Python document storage. Requires an RWX-capable storage class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-uploads-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.sharedStorage.uploadsSize }}

---
# --- Frontend ---
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.port }}
  selector:
    app: {{ .Release.Name }}-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}

---
# --- Ingress ---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-java
                port:
                  number: {{ .Values.javaBackend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
