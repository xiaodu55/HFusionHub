# --- Python AI HorizontalPodAutoscaler ---
{{- if and .Values.pythonAi.enabled (gt (int .Values.pythonAi.minReplicas) 0) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-python
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-python
  minReplicas: {{ .Values.pythonAi.minReplicas }}
  maxReplicas: {{ .Values.pythonAi.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
