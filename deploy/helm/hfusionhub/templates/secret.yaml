# --- Secret ---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  mysql-root-password: {{ required "mysqlRootPassword is required" .Values.secrets.mysqlRootPassword | quote }}
  mysql-password: {{ required "mysqlPassword is required" .Values.secrets.mysqlPassword | quote }}
  python-ai-internal-token: {{ required "pythonAiInternalToken is required" .Values.secrets.pythonAiInternalToken | quote }}
  callback-secret: {{ required "callbackSecret is required" .Values.secrets.callbackSecret | quote }}
  admin-password: {{ required "adminPassword is required" .Values.secrets.adminPassword | quote }}
  deepseek-api-key: {{ required "deepseekApiKey is required" .Values.secrets.deepseekApiKey | quote }}
  {{- if .Values.pluginRunner.enabled }}
  plugin-runner-token: {{ required "pluginRunnerToken is required when pluginRunner.enabled" .Values.secrets.pluginRunnerToken | quote }}
  {{- end }}
