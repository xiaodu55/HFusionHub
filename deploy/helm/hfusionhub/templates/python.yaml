# --- Python AI ---
{{- if .Values.pythonAi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-python
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.pythonAi.port }}
      targetPort: {{ .Values.pythonAi.port }}
  selector:
    app: {{ .Release.Name }}-python
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-python
spec:
  replicas: {{ .Values.pythonAi.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-python
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-python
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurity.runAsUser }}
        runAsGroup: {{ .Values.podSecurity.runAsGroup }}
        fsGroup: {{ .Values.podSecurity.fsGroup }}
      containers:
        - name: python-ai
          image: {{ .Values.pythonAi.image }}
          ports:
            - containerPort: {{ .Values.pythonAi.port }}
          env:
            # 写侧时钟口径（第一百零二批）：Python 侧的墙钟读的是进程时区，
            # 容器默认 TZ 跟随节点。不声明这一行，同一份代码在不同节点上给
            # 模型的时间答案可以差 8 小时。与 dev/prod compose 的 TZ 成对。
            - name: TZ
              value: {{ .Values.pythonAi.tz | quote }}
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: deepseek-api-key
            - name: PYTHON_AI_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: python-ai-internal-token
            - name: CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: callback-secret
            - name: TASK_QUEUE_MODE
              value: {{ .Values.pythonAi.taskQueueMode | quote }}
            - name: JAVA_BACKEND_URL
              value: "http://{{ .Release.Name }}-java:{{ .Values.javaBackend.port }}"
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: {{ .Values.pythonAi.port | quote }}
            - name: VECTOR_STORE_MODE
              value: {{ .Values.vectorStore.mode | quote }}
            - name: SERVER_ENV
              value: {{ .Values.vectorStore.env | quote }}
            - name: MILVUS_HOST
              value: {{ tpl .Values.vectorStore.host $ | quote }}
            - name: MILVUS_PORT
              value: {{ .Values.vectorStore.port | quote }}
            - name: MILVUS_COLLECTION
              value: {{ .Values.vectorStore.collection | quote }}
            - name: DOCUMENT_STORAGE_ROOT
              value: /app/uploads/documents
            # 审计队列（SQLite）落在 PVC 上：家目录在镜像层里，Pod 重建即丢积压。
            # 每 Pod 一个子目录，避免多副本共写同一个 SQLite 文件（共享卷上 WAL 不可用）。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HFUSIONHUB_AUDIT_DB_PATH
              value: "/app/audit-queue/$(POD_NAME)"
            # 评测产物（runs/reports/scores）写一次、之后按文件名读回 ⇒ 共享 RWX 卷，
            # 否则副本 A 生成的报告对副本 B 不可见，Pod 重建后四个读端点全 404。
            - name: EVAL_HARNESS_DATA_DIR
              value: /app/eval-harness
            # judge 缓存是整文件 read-modify-write，与上面的共享根分面：同一块卷上按 Pod 分目录。
            - name: EVAL_JUDGE_CACHE_PATH
              value: "/app/eval-harness/$(POD_NAME)/judge_cache.json"
            {{- if .Values.pluginRunner.enabled }}
            - name: PLUGIN_RUNNER_URL
              value: "http://{{ .Release.Name }}-plugin-runner:{{ .Values.pluginRunner.port }}"
            - name: PLUGIN_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: plugin-runner-token
            {{- end }}
          resources:
            {{- toYaml .Values.pythonAi.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.pythonAi.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.pythonAi.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: shared-uploads
              mountPath: /app/uploads
            - name: audit-queue
              mountPath: /app/audit-queue
            - name: eval-harness
              mountPath: /app/eval-harness
      volumes:
        - name: shared-uploads
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-uploads-pvc
        - name: audit-queue
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-audit-pvc
        - name: eval-harness
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-eval-pvc
---
# 评测产物（runs/reports/scores）卷。RWX：2 副本里 A 生成、B 要能读回对比。
# judge 缓存也在这一块上，但走 $(POD_NAME) 子目录，见上面的 env。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-eval-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.pythonAi.evalReportsSize }}
---
# 插件审计队列（SQLite）卷。RWX：python 有 2 副本，各写自己的 POD_NAME 子目录。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-audit-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.pythonAi.auditQueueSize }}
{{- end }}
