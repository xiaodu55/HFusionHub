# HFusionHub Helm Chart — Default Values

# Global settings
global:
  imageRegistry: ""
  storageClass: ""

sharedStorage:
  uploadsSize: 10Gi

# --- 应用容器的运行身份（java / python 共用）---
# 三个号必须与 deploy/Dockerfile.java、deploy/Dockerfile.python 里钉的 uid/gid
# 完全一致，门禁：scripts/static-checks.py --container-uid。
# fsGroup 是本批的关键：uploads 卷是 python(2 副本) 与 java 共用的 RWX 卷，没有
# fsGroup 时 kubelet 不会把卷 chown 给任何一个组，卷属主由 storage class 决定，
# 非 root 进程写 /app/uploads、/app/audit-queue 就是碰运气；同号的 runAsGroup +
# fsGroup 让两个工作负载在同一块卷上互可读写（新建文件继承组）。
# 号选 10001：Debian/Alpine 的系统 uid 池都是 100–999，池外的号不会与基镜像里
# 已有的账号抢号。
# 已有部署注意：升级镜像后卷里旧文件的属主仍是旧 uid，需要一次性 chown -R 10001:10001
# 或删除卷重建（数据会丢），见 docs/PRODUCTION_OPS.md「卷属主与运行身份」。
podSecurity:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# --- MySQL ---
mysql:
  enabled: true
  image: mysql:8.0
  port: 3306
  database: hfusionhub
  username: hfusionhub
  persistence:
    size: 10Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# --- Redis ---
redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  persistence:
    size: 1Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# --- Java Backend ---
javaBackend:
  enabled: true
  image: ghcr.io/xiaodu55/hfusionhub-java:latest
  port: 8080
  replicas: 1
  javaOpts: "-Xmx512m -Xms256m"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 8080

# --- Python AI ---
pythonAi:
  enabled: true
  image: ghcr.io/xiaodu55/hfusionhub-python:latest
  port: 9000
  # Batch 8 任务队列模式：inline（默认，进程内）| arq（需另行部署 Redis + arq worker）
  taskQueueMode: "inline"
  # Stateless: >=2 replicas in production. Vector data lives in Milvus and
  # uploads on a shared RWX volume. The one exception is the plugin audit
  # queue (SQLite), which is per-pod state and therefore gets its own RWX
  # volume with one sub-directory per pod — see templates/python.yaml.
  # Deliberately NOT set here: RAG_EVALUATION_DB_PATH. The evaluation history
  # is a read surface ("recent runs" panel), so a per-pod directory would show
  # only the answering replica's runs, while 2 replicas sharing one SQLite file
  # is exactly the lock-stomping the audit rule above forbids. Compose sets it
  # (single writer); fixing it here needs a shared store, not a volume path.
  replicas: 2
  minReplicas: 2
  maxReplicas: 8
  auditQueueSize: 1Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# --- Isolated Plugin Runner ---
# The runner reaches a dedicated Docker Engine over TLS. It is deliberately
# not given a host docker.sock mount. Provide a Kubernetes TLS secret with
# ca.pem, cert.pem and key.pem keys, then set tlsSecretName and dockerHost.
pluginRunner:
  enabled: true
  image: ghcr.io/xiaodu55/hfusionhub-plugin-runner:latest
  port: 9100
  dockerHost: ""
  tlsSecretName: ""
  artifactsSize: 1Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# --- Vector store / Milvus ---
vectorStore:
  mode: cluster
  env: production
  host: "{{ .Release.Name }}-milvus"
  port: "19530"
  collection: hfusionhub_chunks

# etcd is required by Milvus standalone (v2.4.6+). The embedded etcd in
# v2.4.0 was deprecated; v2.6.6 requires an external etcd endpoint.
etcd:
  enabled: true
  image: quay.io/coreos/etcd:v3.5.18
  port: 2379
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Bundled Milvus standalone. Set milvus.enabled=false and point
# vectorStore.host at an externally-managed Milvus service when required.
milvus:
  enabled: true
  image: milvusdb/milvus:v2.6.6
  port: 19530
  persistence:
    size: 20Gi
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Attu — Milvus 网页管理控制台（与 docker-compose 拓扑对齐，默认关闭）
attu:
  enabled: false
  image: zilliz/attu:v2.6.3
  port: 3000
  milvusUrl: "http://{{ .Release.Name }}-milvus:19530"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# --- Frontend ---
frontend:
  enabled: true
  image: ghcr.io/xiaodu55/hfusionhub-frontend:latest
  port: 80
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  service:
    type: ClusterIP
    port: 80

# --- Ingress (optional) ---
ingress:
  enabled: false
  className: nginx
  host: hfusionhub.local
  tls: []

# --- Secrets (REQUIRED — set via --set or sealed secrets) ---
secrets:
  mysqlRootPassword: ""
  mysqlPassword: ""
  pythonAiInternalToken: ""
  callbackSecret: ""
  adminPassword: ""
  deepseekApiKey: ""
  pluginRunnerToken: ""
