# HFusionHub Helm Chart — Default Values

# Global settings
global:
  imageRegistry: ""
  storageClass: ""

sharedStorage:
  uploadsSize: 10Gi

# --- MySQL ---
mysql:
  enabled: true
  image: mysql:8.0
  port: 3306
  database: hfusionhub
  username: hfusionhub
  persistence:
    size: 10Gi
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# --- Redis ---
redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  persistence:
    size: 1Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# --- Java Backend ---
javaBackend:
  enabled: true
  image: ghcr.io/xiaodu55/hfusionhub-java:latest
  port: 8080
  replicas: 1
  javaOpts: "-Xmx512m -Xms256m"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 8080

# --- Python AI ---
pythonAi:
  enabled: true
  image: ghcr.io/xiaodu55/hfusionhub-python:latest
  port: 9000
  # Batch 8 任务队列模式：inline（默认，进程内）| arq（需另行部署 Redis + arq worker）
  taskQueueMode: "inline"
  # Stateless: >=2 replicas in production. No per-pod RWO state is required
  # because vector data lives in Milvus and uploads are on a shared RWX volume.
  replicas: 2
  minReplicas: 2
  maxReplicas: 8
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# --- Isolated Plugin Runner ---
# The runner reaches a dedicated Docker Engine over TLS. It is deliberately
# not given a host docker.sock mount. Provide a Kubernetes TLS secret with
# ca.pem, cert.pem and key.pem keys, then set tlsSecretName and dockerHost.
pluginRunner:
  enabled: true
  image: ghcr.io/xiaodu55/hfusionhub-plugin-runner:latest
  port: 9100
  dockerHost: ""
  tlsSecretName: ""
  artifactsSize: 1Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# --- Vector store / Milvus ---
vectorStore:
  mode: cluster
  env: production
  host: "{{ .Release.Name }}-milvus"
  port: "19530"
  collection: hfusionhub_chunks

# etcd is required by Milvus standalone (v2.4.6+). The embedded etcd in
# v2.4.0 was deprecated; v2.6.6 requires an external etcd endpoint.
etcd:
  enabled: true
  image: quay.io/coreos/etcd:v3.5.18
  port: 2379
  persistence:
    size: 5Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Bundled Milvus standalone. Set milvus.enabled=false and point
# vectorStore.host at an externally-managed Milvus service when required.
milvus:
  enabled: true
  image: milvusdb/milvus:v2.6.6
  port: 19530
  persistence:
    size: 20Gi
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

# Attu — Milvus 网页管理控制台（与 docker-compose 拓扑对齐，默认关闭）
attu:
  enabled: false
  image: zilliz/attu:v2.6.3
  port: 3000
  milvusUrl: "http://{{ .Release.Name }}-milvus:19530"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# --- Frontend ---
frontend:
  enabled: true
  image: ghcr.io/xiaodu55/hfusionhub-frontend:latest
  port: 80
  replicas: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  service:
    type: ClusterIP
    port: 80

# --- Ingress (optional) ---
ingress:
  enabled: false
  className: nginx
  host: hfusionhub.local
  tls: []

# --- Secrets (REQUIRED — set via --set or sealed secrets) ---
secrets:
  mysqlRootPassword: ""
  mysqlPassword: ""
  pythonAiInternalToken: ""
  callbackSecret: ""
  adminPassword: ""
  deepseekApiKey: ""
  pluginRunnerToken: ""
