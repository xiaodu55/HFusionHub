# HFusionHub Monitoring Stack
#
# Usage:
#   docker compose -f deploy/docker-compose.monitoring.yml up -d
#       # 独立启动：Grafana + Prometheus + Alertmanager + Tempo（Grafana 密码见 deploy/.env）
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.monitoring.yml #     --profile exporters up -d
#       # 生产 overlay 全量（额外拉起 mysqld/redis exporter，需同网络可达 mysql8/redis7）
#
# Services:
#   - Prometheus (scrapes Python AI /metrics + Java /actuator/prometheus)
#   - Grafana (dashboards + alert rules, auto-provisioned)
#   - Alertmanager (routes alerts to notification channels)

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: hfusionhub-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: hfusionhub-grafana
    ports:
      # 3001 避开前端 dev server 的 3000 端口
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/hfusionhub.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hfusionhub-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  # Tempo — 分布式追踪后端（OTLP HTTP 4318 接收，查询 API 3200）。
  # Java（TRACING_ENABLED=true）与 Python（OTEL_ENABLED=true）的 span 都推到这里；
  # 4318 绑定 127.0.0.1 是为了宿主机直跑的 Java/Python 开发进程能推送。
  tempo:
    image: grafana/tempo:2.7.0
    container_name: hfusionhub-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3200:3200"
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  # MySQL exporter — scrape mysqld_* metrics into Prometheus.
  # Requires MYSQL_ROOT_PASSWORD from deploy/.env (shared with the prod compose).
  mysqld-exporter:
    # profiles: 仅生产 overlay（与 docker-compose.prod.yml 同启）时拉起——
    # 独立启动监控栈时无 mysql8/redis7 网络可连，会进入重启循环
    profiles: ["exporters"]
    image: prom/mysqld-exporter:v0.15.1
    container_name: hfusionhub-mysqld-exporter
    environment:
      # Root needs no extra grants to read performance_schema; a dedicated
      # "exporter" user (PROCESS/REPLICATION CLIENT/SELECT) is a hardening step.
      DATA_SOURCE_NAME: "root:${MYSQL_ROOT_PASSWORD:?required}@tcp(mysql8:3306)/"
    ports:
      - "127.0.0.1:9104:9104"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Redis exporter — scrape redis_* metrics into Prometheus.
  redis-exporter:
    # profiles: 仅生产 overlay（与 docker-compose.prod.yml 同启）时拉起——
    # 独立启动监控栈时无 mysql8/redis7 网络可连，会进入重启循环
    profiles: ["exporters"]
    image: oliver006/redis_exporter:v1.62.0
    container_name: hfusionhub-redis-exporter
    environment:
      REDIS_ADDR: redis://redis7:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  tempo-data:
