# Prometheus configuration for HFusionHub monitoring stack
# Scrapes Python AI metrics (/metrics) and Java Actuator (/api/actuator/prometheus)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "hfusionhub-python-ai"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["python-ai:9000"]
        labels:
          service: python-ai
    scrape_interval: 10s

  - job_name: "hfusionhub-java-backend"
    metrics_path: "/api/actuator/prometheus"
    static_configs:
      - targets: ["java-backend:8080"]
        labels:
          service: java-backend
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
