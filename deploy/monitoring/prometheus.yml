# Prometheus configuration for HFusionHub monitoring stack
# Scrapes Python AI metrics (/metrics) and Java Actuator (management port 9092)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "hfusionhub-python-ai"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["python-ai:9000"]
        labels:
          service: python-ai
    scrape_interval: 10s

  - job_name: "hfusionhub-java-backend"
    # Actuator 独立管理端口（第十五轮 P0-8）：/api/actuator/** 曾被 Sa-Token
    # 登录拦截器覆盖，无会话抓取实际 401；现改抓 9092 管理端口。
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["java-backend:9092"]
        labels:
          service: java-backend
    scrape_interval: 10s

  # MySQL exporter (deploy/docker-compose.monitoring.yml -> mysqld-exporter)
  - job_name: "hfusionhub-mysql"
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          service: mysql
    scrape_interval: 15s

  # Redis exporter (deploy/docker-compose.monitoring.yml -> redis-exporter)
  - job_name: "hfusionhub-redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis
    scrape_interval: 15s

  # Milvus ships its own Prometheus endpoint on the metrics port (9091),
  # so no exporter is needed — scrape it directly.
  - job_name: "hfusionhub-milvus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["milvus:9091"]
        labels:
          service: milvus
    scrape_interval: 15s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
