# SLO Alert Rules for HFusionHub
# Covers: Chat availability, Agent failure rate, P95 latency, Tool success,
#         Unauthorized access, Daily cost, Eval quality regression, Queue backlog

groups:
  # ── SLO: Availability & Error Rate ────────────────────────────────────────
  - name: hfusionhub_slo_availability
    rules:
      - alert: ChatAvailabilityBelowSLO
        expr: |
          (
            sum(rate(hfusionhub_chat_requests_total[5m]))
            - sum(rate(hfusionhub_chat_errors_total[5m]))
          )
          / sum(rate(hfusionhub_chat_requests_total[5m]))
          < 0.999
        for: 5m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Chat availability below 99.9% SLO"
          description: "Chat success rate is {{ $value | humanizePercentage }} over the last 5 minutes (SLO target: 99.9%)."
          runbook: "Check Python AI service logs and Java→Python connectivity."

      - alert: ChatErrorRateHigh
        expr: |
          sum(rate(hfusionhub_chat_errors_total[5m]))
          / sum(rate(hfusionhub_chat_requests_total[5m]))
          > 0.05
        for: 3m
        labels:
          severity: warning
          slo: error_rate
        annotations:
          summary: "Chat error rate exceeds 5%"
          description: "Chat error rate is {{ $value | humanizePercentage }} over the last 3 minutes."

  # ── SLO: P95 Latency ─────────────────────────────────────────────────────
  - name: hfusionhub_slo_latency
    rules:
      - alert: ChatP95LatencyHigh
        expr: |
          hfusionhub_chat_latency_seconds{quantile="0.95"} > 20
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "Chat P95 latency exceeds 20s SLO"
          description: "Chat P95 latency is {{ $value | humanizeDuration }} over the last 5 minutes (SLO target: ≤20s)."

      - alert: FirstTokenP95LatencyHigh
        expr: |
          hfusionhub_http_latency_seconds{quantile="0.95"} > 3
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "First Token P95 latency exceeds 3s SLO"
          description: "First token P95 latency is {{ $value | humanizeDuration }} over the last 5 minutes (SLO target: ≤3s)."

      - alert: P95LatencyCritical
        expr: |
          hfusionhub_chat_latency_seconds{quantile="0.95"} > 60
        for: 3m
        labels:
          severity: critical
          slo: latency
        annotations:
          summary: "Chat P95 latency exceeds 60s (critical)"
          description: "Chat P95 latency is {{ $value | humanizeDuration }} — likely a stuck or timeout request."

  # ── SLO: Tool Success Rate ────────────────────────────────────────────────
  - name: hfusionhub_slo_tools
    rules:
      - alert: ToolSuccessRateLow
        expr: |
          (
            sum(hfusionhub_chat_requests_total)
            - sum(hfusionhub_chat_errors_total)
          )
          / sum(hfusionhub_chat_requests_total)
          < 0.99
        for: 10m
        labels:
          severity: warning
          slo: tool_success
        annotations:
          summary: "Agent success rate below 99% SLO"
          description: "Agent success rate is {{ $value | humanizePercentage }} over the last 10 minutes."

      - alert: ToolFailureRateHigh
        expr: |
          sum(rate(hfusionhub_chat_errors_total[10m]))
          / sum(rate(hfusionhub_chat_requests_total[10m]))
          > 0.01
        for: 5m
        labels:
          severity: critical
          slo: tool_success
        annotations:
          summary: "Tool failure rate exceeds 1%"
          description: "Tool failure rate is {{ $value | humanizePercentage }} over the last 5 minutes."

  # ── SLO: Unauthorized Access ──────────────────────────────────────────────
  - name: hfusionhub_slo_security
    rules:
      - alert: UnauthorizedAccessAttempt
        expr: |
          sum(increase(hfusionhub_http_status_4xx_total[5m])) > 10
        for: 1m
        labels:
          severity: critical
          slo: security
        annotations:
          summary: "Multiple 4xx responses detected"
          description: "{{ $value }} unauthorized (4xx) responses in the last 5 minutes. Possible credential stuffing or token leakage."

  # ── SLO: Eval Quality Regression ──────────────────────────────────────────
  - name: hfusionhub_slo_quality
    rules:
      - alert: EvalQualityRegression
        expr: |
          increase(hfusionhub_eval_gate_failures_total[24h]) > 0
        for: 0m
        labels:
          severity: critical
          slo: quality
        annotations:
          summary: "Runtime eval gate failure detected"
          description: "The nightly runtime evaluation detected a quality gate failure in the last 24 hours. Check eval-runtime-report artifact."

      - alert: CitationFaithfulnessLow
        expr: |
          hfusionhub_citation_faithfulness_current{quantile="0.5"} < 0.60
        for: 1h
        labels:
          severity: warning
          slo: quality
        annotations:
          summary: "Citation faithfulness below 60% threshold"
          description: "Citation faithfulness is {{ $value | humanizePercentage }} — sources cited may not support the answer."

  # ── SLO: Daily Cost ───────────────────────────────────────────────────────
  - name: hfusionhub_slo_cost
    rules:
      - alert: DailyCostExceedsBudget
        expr: |
          sum(increase(hfusionhub_chat_requests_total[24h]))
          * 0.001
          > 10.0
        for: 0m
        labels:
          severity: warning
          slo: cost
        annotations:
          summary: "Estimated daily cost exceeds $10 budget"
          description: "Based on request volume, estimated daily cost is ${{ $value | printf \"%.2f\" }}."

  # ── SLO: Service Health ───────────────────────────────────────────────────
  - name: hfusionhub_slo_health
    rules:
      - alert: PythonAIServiceDown
        expr: |
          up{job="hfusionhub-python-ai"} == 0
        for: 1m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Python AI service is DOWN"
          description: "Python AI service has been unreachable for over 1 minute."

      - alert: JavaBackendDown
        expr: |
          up{job="hfusionhub-java-backend"} == 0
        for: 1m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Java backend service is DOWN"
          description: "Java backend service has been unreachable for over 1 minute."

      - alert: MySQLDown
        expr: |
          up{job="hfusionhub-mysql"} == 0
        for: 1m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "MySQL is DOWN"
          description: "mysqld-exporter reports MySQL unreachable for over 1 minute."

      - alert: RedisDown
        expr: |
          up{job="hfusionhub-redis"} == 0
        for: 1m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Redis is DOWN"
          description: "redis-exporter reports Redis unreachable for over 1 minute."

      - alert: MilvusDown
        expr: |
          up{job="hfusionhub-milvus"} == 0
        for: 1m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "Milvus is DOWN"
          description: "Milvus metrics endpoint unreachable for over 1 minute."

      - alert: HighMemoryUsage
        expr: |
          jvm_memory_used_bytes{area="heap"}
          / jvm_memory_max_bytes{area="heap"}
          > 0.90
        for: 5m
        labels:
          severity: warning
          slo: health
        annotations:
          summary: "Java heap usage above 90%"
          description: "Java heap memory usage is {{ $value | humanizePercentage }}."

      - alert: MySQLConnectionsHigh
        expr: |
          mysql_global_status_threads_connected
          / mysql_global_variables_max_connections
          > 0.8
        for: 10m
        labels:
          severity: warning
          slo: health
        annotations:
          summary: "MySQL connection usage above 80%"
          description: "MySQL has {{ $value | humanizePercentage }} of its max connections in use."

      - alert: RedisMemoryHigh
        expr: |
          redis_memory_used_bytes / (redis_memory_max_bytes > 0)
          > 0.9
        for: 10m
        labels:
          severity: warning
          slo: health
        annotations:
          summary: "Redis memory usage above 90%"
          description: "Redis used {{ $value | humanizePercentage }} of its maxmemory."

  # ── SLO: Queue & Async Backlog ────────────────────────────────────────────
  - name: hfusionhub_slo_queue
    rules:
      - alert: AgentQueueBacklogHigh
        expr: |
          hfusionhub_agent_queue_depth > 50
        for: 10m
        labels:
          severity: warning
          slo: queue
        annotations:
          summary: "Agent queue backlog exceeds 50 tasks"
          description: "Agent queue depth is {{ $value }} — requests may be delayed."
