# Alertmanager configuration for HFusionHub
# Routes alerts to configured notification channels

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'slo', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h
    - match:
        slo: quality
      receiver: 'quality-alerts'
      repeat_interval: 24h

receivers:
  - name: 'default'
    # Configure your notification channel here:
    # webhook_configs:
    #   - url: 'http://your-webhook-endpoint/alerts'
    #     send_resolved: true
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#hfusionhub-alerts'
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    # email_configs:
    #   - to: 'team@example.com'
    #     from: 'alertmanager@hfusionhub.com'
    #     smarthost: 'smtp.example.com:587'

  - name: 'critical'
    # High-priority channel for critical alerts
    # webhook_configs:
    #   - url: 'http://your-webhook-endpoint/critical'
    #     send_resolved: true

  - name: 'quality-alerts'
    # Quality regression alerts — may go to a different channel
    # webhook_configs:
    #   - url: 'http://your-webhook-endpoint/quality'
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'slo']
