# HFusionHub Frontend — Nginx config
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 文本资源 gzip 压缩（/api/ 内关闭，避免 gzip 缓冲破坏 SSE 流式输出）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ── 安全响应头（全局基线）───────────────────────────────────────
    # 注意 nginx 的 add_header 继承规则：location 内一旦出现 add_header，
    # 服务级头的全部继承即失效——需要保留的头部必须在 location 内重复。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 主应用禁止被第三方 iframe 嵌套（点击劫持防护）；
    # /embed/ 下的对外挂件单独放开（见下方 location）。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # 哈希命名的构建产物（Vite assets）——内容不变即缓存永久
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 可嵌入挂件（/embed/chat 由外部站点 iframe 引用）——放开嵌套限制
    location /embed/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Java backend
    location /api/ {
        gzip off;  # SSE：gzip 缓冲会阻塞流式输出
        proxy_pass http://java-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;  # SSE streaming
        proxy_buffering off;       # Disable buffering for SSE
    }
}
