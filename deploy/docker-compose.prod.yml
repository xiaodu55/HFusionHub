# HFusionHub — Production Docker Compose
#
# 两种部署方式：
#   A) 拉取预构建镜像（推荐，无需本地构建）：
#        cp deploy/.env.example deploy/.env   # 再编辑 deploy/.env 填入密钥
#        docker compose -f deploy/docker-compose.prod.yml pull
#        docker compose -f deploy/docker-compose.prod.yml up -d
#   B) 本地构建镜像（离线 / 自研场景）：
#        docker compose -f deploy/docker-compose.prod.yml build
#        docker compose -f deploy/docker-compose.prod.yml up -d
#
# 镜像地址可通过 REGISTRY / HFUSIONHUB_TAG 环境变量覆盖，
# 例如 REGISTRY=registry.example.com/hfusionhub HFUSIONHUB_TAG=1.0.0。
#
# Start:  docker compose -f deploy/docker-compose.prod.yml up -d
# Stop:   docker compose -f deploy/docker-compose.prod.yml down
# Logs:   docker compose -f deploy/docker-compose.prod.yml logs -f
#
# Requires a deploy/.env file with secrets (see deploy/.env.example).

services:
  # -----------------------------------------------------------------------
  # Infrastructure
  # -----------------------------------------------------------------------
  mysql8:
    image: mysql:8.0
    container_name: hfusionhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: hfusionhub
      MYSQL_USER: hfusionhub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1Gi
          cpus: "0.5"
    restart: unless-stopped

  redis7:
    image: redis:7-alpine
    container_name: hfusionhub-redis
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ../docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["sh", "-c", "redis-server /usr/local/etc/redis/redis.conf --requirepass \"$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256Mi
          cpus: "0.2"
    restart: unless-stopped

  # Optional: Ollama for local embedding (uncomment to enable)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: hfusionhub-ollama
  #   ports:
  #     - "127.0.0.1:11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   environment:
  #     OLLAMA_KEEP_ALIVE: 24h
  #   restart: unless-stopped

  # etcd — Milvus 2.6 standalone 的元数据存储（2.6 起不再支持嵌入式 etcd）
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: hfusionhub-etcd
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379"]
    ports:
      - "127.0.0.1:2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512Mi
          cpus: "0.5"
    restart: unless-stopped

  # Milvus standalone for production vector storage (replaces embedded Lite).
  milvus:
    image: milvusdb/milvus:v2.6.6
    container_name: hfusionhub-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: http://etcd:2379
      COMMON_STORAGETYPE: local
      # 可选认证：MILVUS_AUTH_ENABLED=true 时启用（Python 需配 MILVUS_USER/MILVUS_PASSWORD，
      # Attu 登录填 root/密码）；默认关闭
      COMMON_SECURITY_AUTHORIZATIONENABLED: ${MILVUS_AUTH_ENABLED:-false}
      COMMON_SECURITY_ROOTPASSWORD: ${MILVUS_ROOT_PASSWORD:-milvus-root-password}
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2Gi
          cpus: "1.0"
    restart: unless-stopped

  # Attu — Milvus 网页管理控制台（浏览集合、向量、相似度搜索）
  attu:
    image: zilliz/attu:v2.6.3
    container_name: hfusionhub-attu
    ports:
      - "127.0.0.1:8000:3000"
    environment:
      # 浏览器端 JS 直连 Milvus：用 IPv4 字面量，避免 localhost 解析到 ::1 导致连接被拒
      MILVUS_URL: http://127.0.0.1:19530
    depends_on:
      milvus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256Mi
          cpus: "0.2"
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Application Services
  # -----------------------------------------------------------------------
  java-backend:
    image: ${REGISTRY:-ghcr.io/xiaodu55}/hfusionhub-java:${HFUSIONHUB_TAG:-latest}
    build:
      context: ../java-backend
      dockerfile: ../deploy/Dockerfile.java
    container_name: hfusionhub-java
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_USERNAME: hfusionhub
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql8:3306/hfusionhub?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis7
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      PYTHON_AI_INTERNAL_TOKEN: ${PYTHON_AI_INTERNAL_TOKEN:?required}
      CALLBACK_SECRET: ${CALLBACK_SECRET:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      AI_SERVICE_URL: http://python-ai:9000
      PYTHON_AI_CALLBACK_BASE_URL: http://java-backend:8080/api
      JAVA_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql8:
        condition: service_healthy
      redis7:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1Gi
          cpus: "0.5"
    restart: unless-stopped

  python-ai:
    image: ${REGISTRY:-ghcr.io/xiaodu55}/hfusionhub-python:${HFUSIONHUB_TAG:-latest}
    build:
      context: ../python-ai
      dockerfile: ../deploy/Dockerfile.python
    container_name: hfusionhub-python
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      PYTHON_AI_INTERNAL_TOKEN: ${PYTHON_AI_INTERNAL_TOKEN:?required}
      CALLBACK_SECRET: ${CALLBACK_SECRET:?required}
      JAVA_BACKEND_URL: http://java-backend:8080
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "9000"
      MILVUS_LITE_PATH: /data/milvus_data.db
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      VECTOR_STORE_MODE: cluster
      SERVER_ENV: production
      CHUNKS_STORE_PATH: /data/chunks_store.json
      UPLOAD_DIR: /data/uploads
      DOCUMENT_STORAGE_ROOT: /app/uploads/documents
      RAG_HYBRID_ENABLED: "true"
      RAG_GRAPH_ENABLED: ${RAG_GRAPH_ENABLED:-false}
      RAG_RERANKER_MODE: ${RAG_RERANKER_MODE:-disabled}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LLM_ALLOW_MOCK: "false"
      EMBEDDING_ALLOW_FALLBACK: "false"
      # The runner owns the Docker API connection. Python only reaches this
      # internal service and must fail closed if it is unavailable.
      PLUGIN_RUNNER_URL: http://plugin-runner:9100
      PLUGIN_RUNNER_TOKEN: ${PLUGIN_RUNNER_TOKEN:?required}
    volumes:
      - python-data:/data
      - uploads-data:/app/uploads
    depends_on:
      java-backend:
        condition: service_healthy
      milvus:
        condition: service_healthy
      plugin-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2Gi
          cpus: "1.0"
    restart: unless-stopped

  # Container plugin execution service. It connects to a separately
  # provisioned Docker Engine over TLS; never mount docker.sock here.
  plugin-runner:
    image: ${REGISTRY:-ghcr.io/xiaodu55}/hfusionhub-plugin-runner:${HFUSIONHUB_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.plugin-runner
    container_name: hfusionhub-plugin-runner
    expose:
      - "9100"
    environment:
      PLUGIN_RUNNER_TOKEN: ${PLUGIN_RUNNER_TOKEN:?required}
      PLUGIN_ARTIFACTS_DIR: /opt/plugin-artifacts
      DOCKER_HOST: ${PLUGIN_RUNNER_DOCKER_HOST:?required}
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      PYTHONDONTWRITEBYTECODE: "1"
    # Required by the local docker:dind rehearsal on Linux. Docker Desktop
    # already provides this hostname; the host-gateway entry is harmless there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - plugin-artifacts:/opt/plugin-artifacts
    secrets:
      - source: plugin-runner-ca
        target: /certs/client/ca.pem
      - source: plugin-runner-cert
        target: /certs/client/cert.pem
      - source: plugin-runner-key
        target: /certs/client/key.pem
    healthcheck:
      # 503 是 runner 连不上隔离引擎时的故意 fail-closed 语义（进程仍存活，
      # 但不可执行插件）。healthcheck 只验证进程能响应 HTTP，不接受 2xx 才计活。
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:9100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512Mi
          cpus: "0.5"

  frontend:
    image: ${REGISTRY:-ghcr.io/xiaodu55}/hfusionhub-frontend:${HFUSIONHUB_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: hfusionhub-frontend
    ports:
      - "80:80"
    depends_on:
      java-backend:
        condition: service_healthy
    healthcheck:
      # 用 127.0.0.1 而非 localhost：nginx 只 listen 80(IPv4)，容器内 localhost
      # 常解析到 ::1(Ipv6)，导致 Connection refused 误判 unhealthy。
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128Mi
          cpus: "0.1"
    restart: unless-stopped

  # HTTPS 反向代理（Caddy 自动证书）：设置 SITE_DOMAIN 后对外提供 https://域名
  caddy:
    image: caddy:2-alpine
    container_name: hfusionhub-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    deploy:
      resources:
        limits:
          memory: 256Mi
          cpus: "0.2"
    restart: unless-stopped

volumes:
  mysql-data:
  python-data:
  uploads-data:
  milvus-data:
  plugin-artifacts:
  caddy-data:
  caddy-config:

secrets:
  plugin-runner-ca:
    file: ${PLUGIN_RUNNER_CA_CERT_FILE:?required}
  plugin-runner-cert:
    file: ${PLUGIN_RUNNER_CLIENT_CERT_FILE:?required}
  plugin-runner-key:
    file: ${PLUGIN_RUNNER_CLIENT_KEY_FILE:?required}
