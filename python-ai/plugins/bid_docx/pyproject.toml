[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfusionhub-plugin-bid-docx"
version = "1.0.0"
description = "HFusionHub 平台内建插件：标书分节草稿 → .docx 导出"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1.0"]

[tool.setuptools]
packages = ["bid_docx"]

[tool.setuptools.package-data]
bid_docx = ["hfusion_plugin.json"]
