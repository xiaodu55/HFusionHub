[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfusionhub-plugin-bid-quote"
version = "1.0.0"
description = "HFusionHub 平台内建插件：投标报价明细 → .xlsx 报价表导出（含评分汇总）"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1.0"]

[tool.setuptools]
packages = ["bid_quote"]

[tool.setuptools.package-data]
bid_quote = ["hfusion_plugin.json"]
