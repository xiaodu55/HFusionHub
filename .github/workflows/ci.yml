name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── 密钥扫描（防硬编码密钥入库）───
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Docker Compose 配置校验 ───
  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev Docker Compose configuration
        run: docker compose -f docker/docker-compose.yml config -q
        env:
          MYSQL_ROOT_PASSWORD: ci-test-root
          MYSQL_PASSWORD: ci-test-pass
          REDIS_PASSWORD: ci-test-redis
      - name: Validate production Docker Compose configuration
        # deploy/docker-compose.prod.yml uses :?required to force secrets;
        # supply benign values so `config -q` renders the full graph (Java,
        # Python, Milvus, plugin-runner, frontend) exactly as it would deploy.
        run: docker compose -f deploy/docker-compose.prod.yml config -q
        env:
          MYSQL_ROOT_PASSWORD: ci-test-root
          MYSQL_PASSWORD: ci-test-pass
          REDIS_PASSWORD: ci-test-redis
          PYTHON_AI_INTERNAL_TOKEN: ci-test-internal-token
          CALLBACK_SECRET: ci-test-callback
          ADMIN_PASSWORD: ci-test-admin
          DEEPSEEK_API_KEY: ci-test-deepseek
          PLUGIN_RUNNER_TOKEN: ci-test-runner-token
          PLUGIN_RUNNER_DOCKER_HOST: tcp://remote-docker:2376
          PLUGIN_RUNNER_CA_CERT_FILE: deploy/runner-tls/ca.pem
          PLUGIN_RUNNER_CLIENT_CERT_FILE: deploy/runner-tls/cert.pem
          PLUGIN_RUNNER_CLIENT_KEY_FILE: deploy/runner-tls/key.pem
      - name: Validate monitoring Docker Compose configuration
        run: docker compose -f deploy/docker-compose.monitoring.yml config -q

  # ─── Helm Chart 渲染门禁 ───
  # 本机常缺 Helm，故真实渲染门禁放到 CI：helm lint 校验 chart 一致性，
  # helm template 在注入必填 secrets / runner TLS / dockerHost 后用一组
  # CI 自包含 values 实际渲染出全部 Kubernetes 资源（含 plugin-runner 的
  # 最小权限安全上下文、Milvus StatefulSet、Ingress），任一 required 字段缺失
  # 或模板语法错误都会让该 job 失败，杜绝"本机能跑、发布机渲染爆炸"。
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint chart
        run: helm lint deploy/helm/hfusionhub
      - name: Render chart with minimal valid values
        # Enable the Opt-in pluginRunner path (TLS + isolated Docker Engine)
        # and provide every Secret so secrets.required checks pass.  Templates
        # are split per component under templates/ (see templates/README notes
        # in deploy/helm/hfusionhub/README.md); helm renders every file into a
        # single multi-document YAML stream.
        run: |
          helm template hfusionhub deploy/helm/hfusionhub \
            --set secrets.mysqlRootPassword=ci-root \
            --set secrets.mysqlPassword=ci-pass \
            --set secrets.pythonAiInternalToken=ci-internal \
            --set secrets.callbackSecret=ci-callback \
            --set secrets.adminPassword=ci-admin \
            --set secrets.deepseekApiKey=ci-deepseek \
            --set secrets.pluginRunnerToken=ci-runner \
            --set pluginRunner.dockerHost=tcp://remote-docker:2376 \
            --set pluginRunner.tlsSecretName=hfusionhub-runner-tls \
            > /tmp/hfusionhub-render.yaml
      - name: Validate rendered manifests against Kubernetes schemas
        # kubeconform checks every YAML document (multi-doc stream) against
        # the official Kubernetes JSON schema — catches template bugs that
        # `helm template` alone (syntax-only) would miss.
        run: |
          docker run --rm -v /tmp/hfusionhub-render.yaml:/data/manifests.yaml \
            ghcr.io/yannh/kubeconform:latest \
            -strict -ignore-missing-schemas /data/manifests.yaml
      - name: Assert rendered resources are non-empty
        run: |
          docs=$(awk '/^---[[:space:]]*$/{n++} END{print n+1}' /tmp/hfusionhub-render.yaml)
          if [ "$docs" -lt 12 ]; then
            echo "::error::Expected >=12 rendered Kubernetes resources, got ${docs}."
            exit 1
          fi
          echo "Rendered $docs Kubernetes resources."

  # ─── 静态一致性（租户列完整性 + 内部 token 键）───
  # 防 V52/V53 类问题复发：MyBatis-Plus 租户拦截器对非忽略表自动注入
  # tenant_id 条件，若表无该列则整表功能 500。本 job 在 PR 阶段静态扫描
  # 迁移 SQL 与 MybatisPlusConfig，发现违规即阻断。
  static-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run static consistency checks
        run: python scripts/static-checks.py

  # ─── Python 静态检查与依赖审计 ───
  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        # 版本与 pyproject required-version 一致：新版本引入新规则会让门禁
        # 在无代码变更时翻红（pyproject 注释见）。
        run: pip install ruff==0.16.3
      - name: Lint with ruff
        run: ruff check . --output-format=github
      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --disable-pip

  # ─── Python AI 服务 ───
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q tests --durations=20 --cov=app --cov-report=term-missing:skip-covered

  # ─── Python AI 容器专项（阻断门禁）───
  # 数据面关键安全门禁：容器插件执行（digest 校验、固定入口、网络/资源限制）。
  # 与常规 python 测试分离，单独预置 Docker + Python 基础镜像，避免镜像环境差异
  # 导致容器专项失效（缺镜像即 FAIL，绝不静默跳过）。
  python-container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Pre-pull Python base image (blocking)
        # 预置并缓存 Python 基础镜像，确保容器专项不因拉取/解析差异而失效。
        run: |
          docker pull python:3.12-slim
          docker image ls python:3.12-slim
          echo "::debug::Python base image ready"
      - name: Run container plugin gates (fail on ANY skip)
        # Run the container suite exactly ONCE, capture the output, and fail if
        # anything was skipped. Any skip (missing Docker daemon, missing base
        # image, etc.) means the P0 container gate did not actually execute.
        shell: bash
        run: |
          set -euo pipefail
          output=$(python -m pytest -q tests/test_plugin_container.py -rs 2>&1)
          echo "$output"
          # pytest summary formats: '39 passed in ...' or '33 passed, 6 skipped in ...'
          skipped=$(echo "$output" | grep -oE '[0-9]+ skipped' | grep -oE '^[0-9]+' | awk '{s+=$1} END{print s+0}')
          if [ "$skipped" -gt 0 ]; then
            echo "::error::Container suite skipped ${skipped} test(s) — P0 container gate cannot pass."
            exit 1
          fi

  # ─── Phase 1/2 评测门禁（离线，免模型免数据库，PR 阻断）───
  eval-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify frozen suite integrity (SHA-256)
        run: python -c "from app.core.rag.eval_baseline import verify_suite_integrity; verify_suite_integrity('evaluation/suite/cases.jsonl','evaluation/suite/suite_manifest.json'); print('frozen suite OK')"
      - name: Run offline evaluation gate
        run: python scripts/eval_offline.py --fail-on-regression
      # ─── 招投标领域评测门禁（B2 垂直化）───
      - name: Verify frozen bid suite integrity (SHA-256)
        run: python -c "from app.core.rag.eval_baseline import verify_suite_integrity; verify_suite_integrity('evaluation/suite_bid/cases.jsonl','evaluation/suite_bid/suite_manifest.json'); print('frozen bid suite OK')"
      - name: Run bid offline evaluation gate
        run: python scripts/eval_offline.py \
          --cases evaluation/suite_bid/cases.jsonl \
          --suite-manifest evaluation/suite_bid/suite_manifest.json \
          --kb-manifest evaluation/kb_bid/kb_manifest.json \
          --baseline evaluation/baseline/bid_baseline.json \
          --minimum-qualification-recall 0.9 \
          --minimum-disqualification-clause-recall 0.9 \
          --minimum-scoring-point-accuracy 0.9 \
          --minimum-bid-terminology-accuracy 0.9 \
          --fail-on-regression
      # ─── 行业方案包评测门禁（P2-4：工程施工 / IT 集成，售卖质量凭证）───
      - name: Verify frozen construction suite integrity (SHA-256)
        run: python -c "from app.core.rag.eval_baseline import verify_suite_integrity; verify_suite_integrity('evaluation/suite_bid_construction/cases.jsonl','evaluation/suite_bid_construction/suite_manifest.json'); print('frozen construction suite OK')"
      - name: Run construction offline evaluation gate
        run: python scripts/eval_offline.py \
          --cases evaluation/suite_bid_construction/cases.jsonl \
          --suite-manifest evaluation/suite_bid_construction/suite_manifest.json \
          --kb-manifest evaluation/kb_bid_construction/kb_manifest.json \
          --baseline evaluation/baseline/bid_construction_baseline.json \
          --minimum-qualification-recall 0.9 \
          --minimum-disqualification-clause-recall 0.9 \
          --minimum-scoring-point-accuracy 0.9 \
          --minimum-bid-terminology-accuracy 0.9 \
          --fail-on-regression
      - name: Verify frozen IT suite integrity (SHA-256)
        run: python -c "from app.core.rag.eval_baseline import verify_suite_integrity; verify_suite_integrity('evaluation/suite_bid_it/cases.jsonl','evaluation/suite_bid_it/suite_manifest.json'); print('frozen IT suite OK')"
      - name: Run IT offline evaluation gate
        run: python scripts/eval_offline.py \
          --cases evaluation/suite_bid_it/cases.jsonl \
          --suite-manifest evaluation/suite_bid_it/suite_manifest.json \
          --kb-manifest evaluation/kb_bid_it/kb_manifest.json \
          --baseline evaluation/baseline/bid_it_baseline.json \
          --minimum-qualification-recall 0.9 \
          --minimum-disqualification-clause-recall 0.9 \
          --minimum-scoring-point-accuracy 0.9 \
          --minimum-bid-terminology-accuracy 0.9 \
          --fail-on-regression
      # ─── 招投标撰写/自检工作流门禁（P1-4：bid_* 改动必须过此门禁）───
      - name: Run bid workflow gate (write + check, hermetic)
        run: python scripts/eval_bid_workflow.py
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-offline-report
          path: python-ai/evaluation/reports/*
          if-no-files-found: warn

  # ─── Java 后端 ───
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: hfusionhub_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check code style (spotless)
        run: mvn --batch-mode spotless:check
      - name: Run unit tests (H2, no external services needed)
        run: mvn --batch-mode test
      # ─── Java→Python 集成冒烟 ───
      # 防 h2c 盲区复发：JDK HttpClient 默认 HTTP_2 对明文 http 发 Upgrade:
      # h2c，uvicorn 拒绝回 400 "Invalid HTTP request"。Java 侧已显式锁定
      # HTTP/1.1，但该链路从未被 CI 验证过。这里起真实 Python AI 服务，
      # 用生产 RestTemplate（与 RestTemplateConfig 同源）POST /api/stats/
      # vector-counts 探测。测试由 CI_SMOKE_PYTHON_URL 门控，本地跳过。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start Python AI service (smoke target)
        working-directory: python-ai
        env:
          PYTHON_AI_INTERNAL_TOKEN: test-internal-token
        run: |
          pip install -r requirements.txt -q
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 9000 > /tmp/python-ai-smoke.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/health > /dev/null 2>&1; then
              echo "Python AI smoke service healthy (attempt $i)"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/health > /dev/null || { echo "::error::Python AI failed to start for smoke test"; tail -50 /tmp/python-ai-smoke.log; exit 1; }
      - name: Run Java→Python integration smoke
        env:
          CI_SMOKE_PYTHON_URL: http://127.0.0.1:9000
        run: mvn --batch-mode test -Dtest=PythonEngineSmokeTest
      - name: Validate Flyway migrations against MySQL
        run: |
          mvn --batch-mode flyway:migrate \
            -Dflyway.url=jdbc:mysql://localhost:3306/hfusionhub_test \
            -Dflyway.user=testuser \
            -Dflyway.password=testpass
      - name: Verify Flyway migration success
        run: |
          mvn --batch-mode flyway:info \
            -Dflyway.url=jdbc:mysql://localhost:3306/hfusionhub_test \
            -Dflyway.user=testuser \
            -Dflyway.password=testpass

  # ─── 前端 ───
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hfusionhub-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hfusionhub-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Run frontend tests
        run: npm run test
      - name: Audit dependencies
        run: npm run audit

  # ─── Production Docker 构建校验 ───
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Java backend image
        uses: docker/build-push-action@v6
        with:
          context: java-backend
          file: deploy/Dockerfile.java
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Python AI image
        uses: docker/build-push-action@v6
        with:
          context: python-ai
          file: deploy/Dockerfile.python
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
