name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Docker Compose 配置校验 ───
  docker-compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose -f docker/docker-compose.yml config -q
        env:
          MYSQL_ROOT_PASSWORD: ci-test-root
          MYSQL_PASSWORD: ci-test-pass
          REDIS_PASSWORD: ci-test-redis

  # ─── Python AI 服务 ───
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q tests --durations=20

  # ─── Phase 1/2 评测门禁（离线，免模型免数据库，PR 阻断）───
  eval-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify frozen suite integrity (SHA-256)
        run: python -c "from app.core.rag.eval_baseline import verify_suite_integrity; verify_suite_integrity('evaluation/suite/cases.jsonl','evaluation/suite/suite_manifest.json'); print('frozen suite OK')"
      - name: Run offline evaluation gate
        run: python scripts/eval_offline.py --fail-on-regression
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-offline-report
          path: python-ai/evaluation/reports/*
          if-no-files-found: warn

  # ─── Java 后端 ───
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: hfusionhub_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit tests (H2, no external services needed)
        run: mvn --batch-mode test
      - name: Validate Flyway migrations against MySQL
        run: |
          mvn --batch-mode flyway:migrate \
            -Dflyway.url=jdbc:mysql://localhost:3306/hfusionhub_test \
            -Dflyway.user=testuser \
            -Dflyway.password=testpass
      - name: Verify Flyway migration success
        run: |
          mvn --batch-mode flyway:info \
            -Dflyway.url=jdbc:mysql://localhost:3306/hfusionhub_test \
            -Dflyway.user=testuser \
            -Dflyway.password=testpass

  # ─── 前端 ───
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hfusionhub-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hfusionhub-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Run frontend tests
        run: npm run test
      - name: Audit dependencies
        run: npm run audit

  # ─── Production Docker 构建校验 ───
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Java backend image
        uses: docker/build-push-action@v6
        with:
          context: java-backend
          file: deploy/Dockerfile.java
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Python AI image
        uses: docker/build-push-action@v6
        with:
          context: python-ai
          file: deploy/Dockerfile.python
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: hfusionhub-frontend
          file: deploy/Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
