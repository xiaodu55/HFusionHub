name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hfusionhub-frontend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: hfusionhub
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hfusionhub-frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: python-ai
        run: pip install -r requirements.txt

      - name: Start Python AI (mock LLM)
        working-directory: python-ai
        env:
          LLM_ALLOW_MOCK: "true"
          EMBEDDING_ALLOW_FALLBACK: "true"
          FEATURE_FLAG_DEGRADATION: "transparent"
          PYTHON_AI_INTERNAL_TOKEN: "e2e-internal-token"
          JAVA_BACKEND_URL: "http://localhost:8080/api"
          JAVA_INTERNAL_TOKEN: "e2e-internal-token"
          APP_HOST: "0.0.0.0"
          APP_PORT: "9000"
        run: python -m app.main &

      - name: Run Flyway migrations
        working-directory: java-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/hfusionhub
          SPRING_DATASOURCE_USERNAME: e2e
          SPRING_DATASOURCE_PASSWORD: e2e-pass
        run: mvn --batch-mode flyway:migrate

      - name: Start Java backend
        working-directory: java-backend
        env:
          SERVER_PORT: "8080"
          SERVER_SERVLET_CONTEXT_PATH: /api
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/hfusionhub
          SPRING_DATASOURCE_USERNAME: e2e
          SPRING_DATASOURCE_PASSWORD: e2e-pass
          DB_USERNAME: e2e
          DB_PASSWORD: e2e-pass
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          ADMIN_PASSWORD: "admin123"
          CALLBACK_SECRET: "e2e-callback-secret"
          PYTHON_AI_BASE_URL: "http://localhost:9000"
          PYTHON_AI_INTERNAL_TOKEN: "e2e-internal-token"
          SA_TOKEN_NAME: "satoken"
          SA_TOKEN_TIMEOUT: "86400"
          SA_TOKEN_ACTIVE_TIMEOUT: "1800"
        run: mvn --batch-mode spring-boot:run &

      - name: Wait for Java backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 2
          done
          echo "Java backend failed to start within 60s"
          exit 1

      - name: Wait for Python AI
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 2
          done
          echo "Python AI failed to start within 40s"
          exit 1

      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke tests
        env:
          CI: "true"
          JAVA_BASE_URL: "http://localhost:8080/api"
          PYTHON_BASE_URL: "http://localhost:9000"
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: hfusionhub-frontend/playwright-report/
          retention-days: 7
      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: hfusionhub-frontend/e2e-results.json
          if-no-files-found: warn

  e2e-full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hfusionhub-frontend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: hfusionhub
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hfusionhub-frontend/package-lock.json

      - name: Install Python dependencies
        working-directory: python-ai
        run: pip install -r requirements.txt

      - name: Start Python AI (mock LLM)
        working-directory: python-ai
        env:
          LLM_ALLOW_MOCK: "true"
          EMBEDDING_ALLOW_FALLBACK: "true"
          FEATURE_FLAG_DEGRADATION: "transparent"
          PYTHON_AI_INTERNAL_TOKEN: "e2e-internal-token"
          JAVA_BACKEND_URL: "http://localhost:8080/api"
          JAVA_INTERNAL_TOKEN: "e2e-internal-token"
          APP_HOST: "0.0.0.0"
          APP_PORT: "9000"
        run: python -m app.main &

      - name: Run Flyway migrations
        working-directory: java-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/hfusionhub
          SPRING_DATASOURCE_USERNAME: e2e
          SPRING_DATASOURCE_PASSWORD: e2e-pass
        run: mvn --batch-mode flyway:migrate

      - name: Start Java backend
        working-directory: java-backend
        env:
          SERVER_PORT: "8080"
          SERVER_SERVLET_CONTEXT_PATH: /api
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/hfusionhub
          SPRING_DATASOURCE_USERNAME: e2e
          SPRING_DATASOURCE_PASSWORD: e2e-pass
          DB_USERNAME: e2e
          DB_PASSWORD: e2e-pass
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          ADMIN_PASSWORD: "admin123"
          CALLBACK_SECRET: "e2e-callback-secret"
          PYTHON_AI_BASE_URL: "http://localhost:9000"
          PYTHON_AI_INTERNAL_TOKEN: "e2e-internal-token"
          SA_TOKEN_NAME: "satoken"
        run: mvn --batch-mode spring-boot:run &

      - name: Wait for Java backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 2
          done
          echo "Java backend failed to start within 60s"
          exit 1

      - name: Wait for Python AI
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 2
          done
          echo "Python AI failed to start within 40s"
          exit 1

      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run full E2E suite
        env:
          CI: "true"
          JAVA_BASE_URL: "http://localhost:8080/api"
          PYTHON_BASE_URL: "http://localhost:9000"
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: hfusionhub-frontend/playwright-report/
          retention-days: 14
      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-full
          path: hfusionhub-frontend/e2e-results.json
          if-no-files-found: warn
      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: hfusionhub-frontend/test-results/
          retention-days: 7
