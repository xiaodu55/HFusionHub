name: Plugin Security Pipeline

on:
  push:
    paths: ['python-ai/plugins/**', 'python-ai/requirements*.in', 'python-ai/app/core/plugin/**']
  pull_request:
    paths: ['python-ai/plugins/**', 'python-ai/requirements*.in', 'python-ai/app/core/plugin/**']
  # 手工触发不影响任何门禁，只是让这条安全流水线能在不改路径文件的前提下按需复跑
  # （SBOM / 许可证扫描本来就有"随时想看一眼"的运维需求）。
  workflow_dispatch:

jobs:
  # ─── 签名验证 ───
  signature-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Install dependencies
        run: pip install -r python-ai/requirements-dev.txt
      - name: Verify plugin signatures
        run: |
          cd python-ai
          python -c "
          import sys, glob, os
          sys.path.insert(0, '.')
          wheels = glob.glob('plugins/**/*.whl', recursive=True)
          if not wheels:
              print('No plugin wheels found — skipping (no artifacts to verify)')
              sys.exit(0)
          from app.core.plugin.signature import verify_wheel_signature
          failed = []
          for w in wheels:
              print(f'Checking {w}...')
              if not verify_wheel_signature(w):
                  failed.append(w)
          if failed:
              print(f'FAILED: {len(failed)} wheel(s) failed signature verification')
              for f in failed:
                  print(f'  - {f}')
              sys.exit(1)
          print(f'All {len(wheels)} wheel(s) passed signature verification')
          "

  # ─── 哈希校验 ───
  hash-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify wheel SHA-256 integrity
        run: |
          cd python-ai
          wheels=$(find plugins -name "*.whl" 2>/dev/null)
          if [ -z "$wheels" ]; then
            echo "No plugin wheels found — skipping"
            exit 0
          fi
          echo "Checking wheel file integrity..."
          failed=0
          for whl in $wheels; do
            echo -n "  $whl: "
            sha256sum "$whl" || { echo "FAILED to compute hash"; failed=1; }
          done
          if [ "$failed" -ne 0 ]; then
            echo "FAILED: Hash verification encountered errors"
            exit 1
          fi
          echo "All wheel hashes computed successfully"

  # ─── 漏洞扫描 ───
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pip-audit
        # 钉版：runner 装的 2.10.1 把报告写成 {"dependencies": […]}，而门里的解析脚本
        # 按"顶层是 list"迭代 —— 旗标与解析形态必须和实际装的版本同源（第一百零四批）。
        run: pip install pip-audit==2.10.1
      - name: Scan Python AI dependencies
        run: |
          cd python-ai
          pip-audit -r requirements.txt --desc --output /tmp/vuln-report.json --format json
          echo "Vulnerability scan complete"
          cat /tmp/vuln-report.json
      - name: Check for critical/high vulnerabilities
        run: |
          python scripts/ci/vuln_report_gate.py /tmp/vuln-report.json
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: /tmp/vuln-report.json
          if-no-files-found: error

  # ─── SBOM 生成 ───
  sbom-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CycloneDX
        # 钉版 + 正确旗标：`environment` 子命令只认 `--of/-o` 与 `--output-format {JSON,XML}`，
        # 旧的 `--format json` 不在旗标表里，这个 job 因此从诞生起就没过过（第一百零四批，
        # 判据见 tests/test_plugin_security_gates.py）。
        # 版本取 7.3.1 ＝ `python-ai/requirements-dev.txt` 自己钉的那一份（runner 从
        # eval-nightly 的日志里装的也是 7.3.1）。改前一度钉成未钉版当时解析到的 7.5.0，
        # 那等于在同一仓里同时存在两个 cyclonedx-bom 版本；实测 7.3.1 的旗标表与 7.5.0 一致
        # （`--of/--output-format {choices: JSON, XML}`、`-o`），且用仓库 venv 真生成过
        # specVersion 1.6 / 126 components 的 SBOM，所以收敛到锁里那版。
        run: pip install cyclonedx-bom==7.3.1
      - name: Generate SBOM
        # 产物描述的对象必须是**产品依赖面**。`environment` 子命令读的是"当前解释器已经装了
        # 什么包"，而这个 job 过去只装了 cyclonedx-bom 自己 ⇒ 产物是 runner 环境的 35 个组件
        # （第一百零四批登记、本批处置；判据是 run 38332373261 的 `sbom` 产物本体：锁在
        # ubuntu 侧适用的 76 个 pin 里 42 个一个都不在，另有 9 个版本不是钉的那一版）。
        # 先按锁安装的形状沿用同流水线 `license-check` 的 `Check licenses` 步骤——同一条 run
        # 的日志 :345 实测它在 ubuntu runner 上 90 秒装完这 76 个包（pywin32 / win32-setctime
        # 按 sys_platform marker 跳过），所以这里不是纸面推演。
        # 组件数交给 helper 判定而不是内联 `python -c`：解析逻辑住在 YAML 里就没法被测试
        # 执行，那正是第一百零四批那条 `AttributeError` 能藏两批的原因。空组件表过去只
        # print('WARNING: …') 且退出 0，现在由 helper 判 2。
        run: |
          cd python-ai
          pip install -r requirements.txt
          cyclonedx-py environment -o ../sbom-python.json --output-format JSON
          echo "SBOM generated"
          python ../scripts/ci/sbom_lock_coverage_gate.py ../sbom-python.json requirements.txt
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-python.json
          if-no-files-found: error

  # ─── 许可证检查 ───
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pip-licenses
        # 钉版 + 正确旗标：runner 装的 pip-licenses 5.5.5，`-f/--format` 的可选值是
        # plain / plain-vertical / markdown / rst / confluence / html / json /
        # json-license-finder / csv（实测自该版本的 `pip-licenses --help`），没有 `table`，
        # 旧旗标 ⇒ `invalid choice: 'table'`，job 从诞生起就没过过（第一百零四批）。
        run: pip install pip-licenses==5.5.5
      - name: Check licenses
        run: |
          cd python-ai
          pip install -r requirements.txt
          pip-licenses --format=json --with-urls --output-file=/tmp/licenses.json
          echo "License scan complete"
          pip-licenses --from=mixed --format=plain --allow-only="MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;ISC;PSF;MPL-2.0;Apache Software License;GNU General Public License v3 (GPLv3);GNU Lesser General Public License v3 (LGPLv3);Python Software Foundation License"
      - name: Verify no disallowed licenses
        run: |
          cd python-ai
          python -c "
          import json, sys
          ALLOWED = {'MIT', 'Apache-2.0', 'BSD-3-Clause', 'BSD-2-Clause', 'ISC', 'PSF',
                     'MPL-2.0', 'Apache Software License', 'GNU General Public License v3 (GPLv3)',
                     'GNU Lesser General Public License v3 (LGPLv3)', 'Python Software Foundation License',
                     'Apache License 2.0', 'The Unlicense', 'Public Domain'}
          with open('/tmp/licenses.json') as f:
              licenses = json.load(f)
          disallowed = []
          for lib in licenses:
              lic = lib.get('License', 'UNKNOWN')
              name = lib.get('Name', 'unknown')
              if lic and lic not in ALLOWED and 'MIT' not in lic and 'Apache' not in lic:
                  disallowed.append(f'{name}: {lic}')
          if disallowed:
              print(f'FAILED: {len(disallowed)} package(s) with disallowed licenses:')
              for d in disallowed:
                  print(f'  - {d}')
              sys.exit(1)
          print('All packages have allowed licenses')
          "
      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: /tmp/licenses.json
          if-no-files-found: error

  # ─── Plugin Runner 构建验证 ───
  plugin-runner-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin-runner image
        run: |
          docker build -f docker/Dockerfile.plugin-runner -t plugin-runner-test .
          echo "Plugin runner image built successfully"
