name: Nightly Evaluation (Runtime)

# Runs the Phase-1 runtime track against a live Python AI service on a schedule.
# The offline gate already runs on every push/PR in ci.yml; this workflow measures
# the answer-layer metrics (latency, tokens, cost, refusal, tool success) that
# only a live service can produce.
#
# Required GitHub configuration:
#   - vars.EVAL_BASE_URL  → staging service URL (e.g. https://staging.example.com)
#   - secrets.EVAL_INTERNAL_TOKEN → X-Internal-Token for the staging service
#
# These are MANDATORY — the workflow fails if they are not set, so stale
# configurations never silently skip quality gates.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Re-freeze the runtime baseline with tonight''s results'
        required: false
        default: false
        type: boolean

env:
  EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL }}
  EVAL_INTERNAL_TOKEN: ${{ secrets.EVAL_INTERNAL_TOKEN }}

jobs:
  eval-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate runtime evaluation configuration
        run: |
          if [ -z "$EVAL_INTERNAL_TOKEN" ] || [ -z "$EVAL_BASE_URL" ]; then
            echo "::error::EVAL_INTERNAL_TOKEN and EVAL_BASE_URL must be configured. Set vars.EVAL_BASE_URL and secrets.EVAL_INTERNAL_TOKEN in the repository settings."
            exit 1
          fi
      - name: Restore runtime baseline (most recent version)
        uses: actions/cache/restore@v4
        with:
          path: python-ai/evaluation/baseline/runtime_baseline.json
          key: runtime-baseline-${{ hashFiles('python-ai/evaluation/suite/cases.jsonl') }}-${{ github.run_id }}
          restore-keys: |
            runtime-baseline-${{ hashFiles('python-ai/evaluation/suite/cases.jsonl') }}-
      - name: Run runtime evaluation gate
        run: |
          args=(--base-url "${EVAL_BASE_URL}" --token "${EVAL_INTERNAL_TOKEN}" --fail-on-regression)
          if [ "${UPDATE_BASELINE}" = "true" ]; then args+=(--update-baseline); fi
          python scripts/eval_runtime.py "${args[@]}"
        env:
          UPDATE_BASELINE: ${{ github.event.inputs.update_baseline == 'true' }}
      - name: Persist re-frozen runtime baseline
        if: ${{ success() && github.event.inputs.update_baseline == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: python-ai/evaluation/baseline/runtime_baseline.json
          key: runtime-baseline-${{ hashFiles('python-ai/evaluation/suite/cases.jsonl') }}-${{ github.run_id }}
      - name: Upload runtime evaluation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-runtime-report
          path: python-ai/evaluation/reports/*
          if-no-files-found: warn
      # 失败告警（可选）：评测红了不再只依赖 CI 红灯/邮件轮询。
      # 在仓库 secrets 配置 ALERT_WEBHOOK_URL（钉钉/企微/Slack 等群机器人）即启用。
      - name: Notify failure via webhook
        if: ${{ failure() }}
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not configured — skip failure notification"
            exit 0
          fi
          payload=$(jq -n --arg text "[HFusionHub] eval-nightly FAILED — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{msgtype: "text", text: {content: $text}}')
          curl -sS --max-time 10 -X POST -H 'Content-Type: application/json' -d "$payload" "$ALERT_WEBHOOK_URL"
