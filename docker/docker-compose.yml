services:
  mysql8:
    image: mysql:8.0.36
    container_name: mysql8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: hfusionhub
      MYSQL_USER: hfusionhub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
          pids: 256
    restart: unless-stopped
    networks:
      - backend

  redis7:
    image: redis:7.2-alpine
    container_name: redis7
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["sh", "-c", "redis-server /usr/local/etc/redis/redis.conf --requirepass \"$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.2"
    restart: unless-stopped
    networks:
      - backend

  minio:
    # 锁版本：latest 漂移会在重启时静默升级，破坏 MinIO 单桶多版本/生命周期兼容性
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 256
    restart: unless-stopped
    networks:
      - backend

  plugin-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.plugin-runner
    container_name: plugin-runner
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      PLUGIN_RUNNER_TOKEN: ${PLUGIN_RUNNER_TOKEN:?PLUGIN_RUNNER_TOKEN must be set}
      PLUGIN_RUNNER_HOST: "0.0.0.0"
      PLUGIN_RUNNER_PORT: "9100"
      # 默认连 compose 内的 dind sidecar；也可指向外部隔离引擎
      # （如 staging-rehearsal.sh 的独立 dind：tcp://host.docker.internal:2376）
      DOCKER_HOST: ${PLUGIN_RUNNER_DOCKER_HOST:-tcp://dind:2376}
      DOCKER_CERT_PATH: "/certs/client"
      DOCKER_TLS_VERIFY: "1"
    volumes:
      # dind TLS 客户端证书（generate-runner-tls.sh --dind-layout 预生成，与 dind server 证书同 CA）
      - ../deploy/runner-tls/dind-certs/client:/certs/client:ro
      - plugin-artifacts:/opt/plugin-artifacts
    depends_on:
      dind:
        condition: service_started
    healthcheck:
      # /health 仅在已连上隔离引擎时返回 2xx —— runner healthy 即「沙箱已解锁」
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
      - plugin-isolated
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 256

  # dind sidecar —— dev 插件沙箱的隔离 Docker Engine（P2-3：bid_docx/bid_quote 容器插件的执行目标）。
  # 证书由 scripts/generate-runner-tls.sh deploy/runner-tls --dind-layout 预生成：
  #   server/ 本服务使用（entrypoint 检测到既有证书则跳过自签生成），client/ 给 plugin-runner。
  # 与 staging-rehearsal.sh 的独立 dind（hfusionhub-rehearsal-dind）同占 127.0.0.1:2376，勿同时运行。
  dind:
    # 与 staging-rehearsal.sh 使用同一本地镜像（离线可用，避免依赖代理拉取）
    image: docker:27-dind
    container_name: dind
    privileged: true
    ports:
      - "127.0.0.1:2376:2376"
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - ../deploy/runner-tls/dind-certs:/certs:ro
      - dind-data:/var/lib/docker
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 1024

  # etcd — Milvus 2.6 standalone 的元数据存储（2.6 起不再支持嵌入式 etcd）
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: etcd
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379"]
    ports:
      - "127.0.0.1:2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 256
    restart: unless-stopped
    networks:
      - backend

  # Milvus Standalone — 向量数据库服务（替代嵌入式 Milvus Lite）
  # 网页控制台：http://localhost:8000（Attu，浏览器直连 127.0.0.1:19530 查看数据）
  milvus:
    image: milvusdb/milvus:v2.6.6
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: http://etcd:2379
      COMMON_STORAGETYPE: local
      # 可选认证：MILVUS_AUTH_ENABLED=true 时启用（Python 需配 MILVUS_USER/MILVUS_PASSWORD，
      # Attu 登录填 root/密码）；默认关闭以保持与现有栈兼容
      COMMON_SECURITY_AUTHORIZATIONENABLED: ${MILVUS_AUTH_ENABLED:-false}
      COMMON_SECURITY_ROOTPASSWORD: ${MILVUS_ROOT_PASSWORD:-milvus-root-password}
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      etcd:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    restart: unless-stopped
    networks:
      - backend

  # Attu — Milvus 网页管理控制台（浏览集合、向量、相似度搜索）
  attu:
    image: zilliz/attu:v2.6.3
    container_name: attu
    ports:
      - "127.0.0.1:8000:3000"
    environment:
      # 浏览器端 JS 直连 Milvus：用 IPv4 字面量，避免 localhost 解析到 ::1 导致连接被拒
      MILVUS_URL: http://127.0.0.1:19530
    depends_on:
      milvus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.2"
    restart: unless-stopped
    networks:
      - backend

  # -----------------------------------------------------------------------
  # Fullstack 一键启动（--profile fullstack）
  #   docker compose -f docker/docker-compose.yml --profile fullstack up -d --build
  # 启动后访问 http://localhost:3000（前端 dev 端口习惯映射到容器 80）
  # -----------------------------------------------------------------------
  java-backend:
    profiles: ["fullstack"]
    image: ${REGISTRY:-ghcr.io/xiaodu55}/hfusionhub-java:${HFUSIONHUB_TAG:-latest}
    build:
      context: ../java-backend
      dockerfile: ../deploy/Dockerfile.java
    container_name: hfusionhub-java
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      # Actuator 独立管理端口（Prometheus 抓取），不映射宿主机
      - "9092"
    environment:
      DB_USERNAME: hfusionhub
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql8:3306/hfusionhub?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis7
      PYTHON_AI_INTERNAL_TOKEN: ${PYTHON_AI_INTERNAL_TOKEN:?PYTHON_AI_INTERNAL_TOKEN must be set}
      CALLBACK_SECRET: ${CALLBACK_SECRET:?CALLBACK_SECRET must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      AI_SERVICE_URL: http://python-ai:9000
      PYTHON_AI_CALLBACK_BASE_URL: http://java-backend:8080/api
      # 开发环境显式开启演示数据端点（应用默认已翻转为 false；/demo/clear 有破坏性）
      DEMO_ENDPOINTS_ENABLED: "true"
      JAVA_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql8:
        condition: service_healthy
      redis7:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
          pids: 256
    restart: unless-stopped
    networks:
      - backend

  python-ai:
    profiles: ["fullstack"]
    image: ${REGISTRY:-ghcr.io/xiaodu55}/hfusionhub-python:${HFUSIONHUB_TAG:-latest}
    build:
      context: ../python-ai
      dockerfile: ../deploy/Dockerfile.python
    container_name: hfusionhub-python
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-replace-with-your-own-key}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      PYTHON_AI_INTERNAL_TOKEN: ${PYTHON_AI_INTERNAL_TOKEN:?PYTHON_AI_INTERNAL_TOKEN must be set}
      CALLBACK_SECRET: ${CALLBACK_SECRET:?CALLBACK_SECRET must be set}
      JAVA_BACKEND_URL: http://java-backend:8080
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "9000"
      VECTOR_STORE_MODE: cluster
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      UPLOAD_DIR: /data/uploads
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_HYBRID_ENABLED: "true"
      LLM_ALLOW_MOCK: "false"
      # 平台内建插件（P2-3 bid_docx/bid_quote）wheel 目录——启动时经 .sha256
      # sidecar 校验加载进本地 registry（app/core/plugin/builtins.py）
      PLUGIN_BUILTIN_WHEELS_DIR: /plugin-wheels
      # 插件签名信任策略（scripts/plugin-provision.sh 注册的平台公钥）
      HFUSIONHUB_PLUGIN_TRUST_DIR: /plugin-trust
      # Batch 8：解析/向量化任务经 arq 队列交由 python-ai-worker 执行
      TASK_QUEUE_MODE: ${TASK_QUEUE_MODE:-arq}
      ARQ_REDIS_DSN: "redis://:${REDIS_PASSWORD:-}@redis7:6379/2"
    volumes:
      - python-data:/data
      - ../python-ai/plugins/dist:/plugin-wheels:ro
      - ../python-ai/plugins/trust:/plugin-trust:ro
    depends_on:
      java-backend:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    restart: unless-stopped
    networks:
      - backend

  python-ai-worker:
    profiles: ["fullstack"]
    image: ${REGISTRY:-ghcr.io/xiaodu55}/hfusionhub-python:${HFUSIONHUB_TAG:-latest}
    build:
      context: ../python-ai
      dockerfile: ../deploy/Dockerfile.python
    container_name: hfusionhub-python-worker
    command: ["python", "-m", "arq", "arq_worker.WorkerSettings"]
    environment:
      PYTHON_AI_INTERNAL_TOKEN: ${PYTHON_AI_INTERNAL_TOKEN:?PYTHON_AI_INTERNAL_TOKEN must be set}
      CALLBACK_SECRET: ${CALLBACK_SECRET:?CALLBACK_SECRET must be set}
      JAVA_BACKEND_URL: http://java-backend:8080
      VECTOR_STORE_MODE: cluster
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      UPLOAD_DIR: /data/uploads
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      RAG_HYBRID_ENABLED: "true"
      LLM_ALLOW_MOCK: "false"
      PLUGIN_BUILTIN_WHEELS_DIR: /plugin-wheels
      HFUSIONHUB_PLUGIN_TRUST_DIR: /plugin-trust
      TASK_QUEUE_MODE: ${TASK_QUEUE_MODE:-arq}
      ARQ_REDIS_DSN: "redis://:${REDIS_PASSWORD:-}@redis7:6379/2"
    volumes:
      - python-data:/data
      - ../python-ai/plugins/dist:/plugin-wheels:ro
      - ../python-ai/plugins/trust:/plugin-trust:ro
    depends_on:
      python-ai:
        condition: service_healthy
      redis7:
        condition: service_healthy
      milvus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    restart: unless-stopped
    networks:
      - backend

  frontend:
    profiles: ["fullstack"]
    image: ${REGISTRY:-ghcr.io/xiaodu55}/hfusionhub-frontend:${HFUSIONHUB_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: hfusionhub-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      java-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge
  plugin-isolated:
    driver: bridge
    internal: true

volumes:
  mysql-data:
  minio-data:
  dind-data:
  plugin-artifacts:
  uploads-data:
  python-data:
  milvus-data:
