# Redis configuration for HFusionHub
# Password is set via --requirepass command-line argument in docker-compose.yml

# Network
bind 0.0.0.0
port 6379

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security (development mode: protected-mode allows localhost connections from Docker)
protected-mode no

# Persistence (development defaults)
save ""
